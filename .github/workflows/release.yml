name: Release

# A release is published by pushing a version tag.
#
# The pattern below is the glob GitHub understands; the verify job re-checks
# the tag as a real regexp and refuses anything the glob lets through.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag only releases when its commit is on this branch.
  RELEASE_BRANCH: main
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_PROGRESS_BAR: 'off'

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch check needs the branch, not just the tagged commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check the tag against the branch, the package and the changelog
        id: check
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$*"
            exit 1
          }

          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            fail "$tag is not a vMAJOR.MINOR.PATCH release tag"
          fi
          version="${tag#v}"

          branch="origin/$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
            fail "$tag points at a commit that is not on $RELEASE_BRANCH"
          fi

          # sr/__init__.py imports nothing but sr.meta, so reading the
          # version needs none of the dependencies installed.
          package="$(python -c \
            'from sr import meta; print(meta.VERSION, meta.DATE.isoformat())')"
          read -r package_version package_date <<< "$package"
          if [ "$package_version" != "$version" ]; then
            fail "sr/meta.py says $package_version, but the tag says $version"
          fi

          # The first release heading: `## [0.1.0] - 2026-09-05`.
          changelog="$(sed -nE \
            '/^## \[/{s/^## \[([^]]*)\]( - ([0-9-]+))?.*$/\1 \3/p;q}' \
            CHANGELOG.md)"
          read -r changelog_version changelog_date <<< "$changelog"
          if [ "$changelog_version" != "$version" ]; then
            fail "CHANGELOG.md heads with ${changelog_version:-nothing}," \
              "but the tag says $version"
          fi
          if [ "$changelog_date" != "$package_date" ]; then
            fail "CHANGELOG.md dates $version ${changelog_date:-nowhere}," \
              "but sr/meta.py says $package_date"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          bash .github/scripts/changelog-section.sh "$VERSION" \
            > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The same lint, type and test checks a pull request gets,
  # run here from their own file rather than copied into this one.
  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/test.yml

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: python -m pip install build twine

      - name: Build the sdist and the wheel
        run: |
          set -euo pipefail
          # The wheel is stamped with the tagged commit's time rather than
          # the time of the run, so that a rebuild of one tag produces the
          # same wheel.  setuptools ignores this for the sdist, which keeps
          # the build time and differs from one run to the next.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build
          ls -l dist

      # One sdist and one pure wheel of the tagged version, and nothing
      # else: whatever is in dist/ is what the upload sends.
      - name: Check the distributions
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*-"$VERSION".tar.gz)
          wheels=(dist/*-"$VERSION"-py3-none-any.whl)
          everything=(dist/*)
          if [ "${#sdists[@]}" -ne 1 ] || [ "${#wheels[@]}" -ne 1 ] \
              || [ "${#everything[@]}" -ne 2 ]; then
            echo "::error::dist/ must hold one sdist and one wheel of $VERSION"
            exit 1
          fi
          python -m twine check --strict dist/*

      # Installed into an empty venv and run from outside the checkout,
      # so that `sr` is imported from the wheel and its dependencies come
      # from the metadata rather than from a working tree.  Both ways
      # of starting the program are run: the command pip made, and -m.
      - name: Install the wheel and run it
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke/bin/python" -c 'import sr.api, sr.pdf'
          for reported in "$("$smoke/bin/s-reports" version)" \
              "$("$smoke/bin/python" -m sr version)"; do
            if [ "$reported" != "sr $VERSION" ]; then
              echo "::error::the installed wheel reports '$reported'"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The one step that cannot be taken back: PyPI never accepts a second
  # file under a name it has seen, even after the first is deleted.
  # Hence everything above gates it, and it runs in an environment,
  # which is where a required reviewer can be set in the repository.
  publish:
    name: Publish to PyPI
    needs: [verify, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: >-
        https://pypi.org/project/s-reports/${{ needs.verify.outputs.version }}
    permissions:
      # Trusted publishing: PyPI exchanges the run's OIDC token for
      # a short-lived upload token, so no secret is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Collect the distributions and checksum them
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -t dist -- staging/dist/*
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: staging/release-notes/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease=false
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
