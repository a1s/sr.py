[[divergence]]
id = "group-opens-where-its-title-lands"
summary = "a group whose title moves to the next page begins on that page here; the reference counts the page it left"
reason = """
When a group opens with no room for its title, the title moves to the next \
page, and two things follow from where the group is taken to begin.  The \
reference takes it to begin where the loop opened it: the page eject counts \
as the group's second page, so `X_PAGE_NUMBER` reads 2 on the page its title \
is on, and the group-scoped fold made at the break is lost to that page's \
reset before the title can read it.  \
doc/expressions.md#predefined-variables counts `X_PAGE_NUMBER` from the \
start of the group, and doc/layout.md#rollback already undid a detail \
band's fold around the eject it causes for the same reason: a \
row counts on the page it lands on.  doc/ now says both: a group that is \
still opening is not advanced by a page eject, and a title's fold is rolled \
back and applied again like a detail band's.  The reference is the side \
that changes.\
"""
ticket = "M8: the eject sequence and rollback, layout.md#sequence; filed against the Go engine"
since = "2026-09-27"
affects = ["probe/pagination/group-title-moves"]

