# Known divergences between this engine and the Go reference.
#
# An entry belongs here only when the difference is intended and
# one side has not caught up yet.  Anything else is a regression,
# and the suite says so.  A registered case that stops differing
# fails the suite: the entry has done its work and comes out.
#
# `ticket` is what retires the entry.  Until the two projects have
# an issue tracker between them it names the milestone that owns
# the change; a URL replaces it once one is filed.
#
# `affects` matches case identifiers with shell globs -- `example/sakila`,
# `probe/expressions/strings`, and so on.  The first matching entry wins.
#
# The first four are the dialect decisions M1 wrote into doc/, each of
# which changes the Go engine.  Every one of them has a probe, so the
# entries record a measured difference rather than an intended one.
# The rest came from building against the oracle: two are defects in
# the reference, one is a grammar that had been left to the host, one
# is a clause doc/ was missing, and one -- `time-before-year-one` --
# is a difference this engine chose and will keep.  M7 added a further
# defect in the reference, `zero-height-float-gap`, and M8 fifteen more.
# From `column-floor` on, eleven are defects in the reference's pagination,
# and four are decisions: `footer-at-a-group-break`, `first-page-init`,
# `carried-once`, and `suppressed-band-ejects`.
#
# The milestone numbers:
#   M0: Scaffold and oracle
#   M1: Close the specification gaps
#   M2: Foundations
#   M3: Expression engine
#   M4: Template model, load, validate
#   M5: Fonts and text metrics
#   M6: Walking skeleton
#   M7: Band building
#   M8: Pagination
#   M9: Deferred evaluation
#   M10: Barcodes
#   M11: Images
#   M12: Subreports
#   M13: Printout completeness
#   M14: PDF renderer
#   M15: Command line and examples

[[divergence]]
id = "strings-are-codepoints"
summary = "len, indexing and slicing count codepoints here and bytes in the reference"
reason = """
doc/expressions.md inherited `starlark-go`'s rule, where a string is a Go \
string and therefore a sequence of bytes.  Neither other Starlark counts \
that way, and the byte reading is wrong for the data this engine formats: \
`title[:20]` can cut a UTF-8 sequence in half and surface as broken glyphs \
in a PDF rather than as an error.  Codepoints is the decision; the Go \
engine is the side that changes.\
"""
ticket = "M1: string semantics, expressions.md"
since = "2026-09-06"
affects = ["probe/expressions/strings", "probe/expressions/strings-*"]

[[divergence]]
id = "string-elems-dropped"
summary = "the string type has codepoints and codepoint_ords only"
reason = """
`elems` and `elem_ords` are the byte pair, and under codepoint indexing \
they have no meaning left.  They come out of the string row of the method \
table; `bytes` keeps its own `elems`, since bytes are bytes.  The reference \
still offers all four.\
"""
ticket = "M1: string semantics, expressions.md:195"
since = "2026-09-06"
affects = ["probe/expressions/string-methods*"]

[[divergence]]
id = "round-builtin"
summary = "a one-argument round is predeclared here and absent in the reference"
reason = """
Added as a convenience spelling for `math.round`, taking one argument and \
rounding half away from zero, so that one rounding rule covers the builtin, \
`quantize`, and coordinate rounding alike.  Adding a predeclared global is \
supported by both hosts, so this is a change the reference takes too.\
"""
ticket = "M1: dialect amendments, expressions.md"
since = "2026-09-06"
affects = ["probe/expressions/round*"]

[[divergence]]
id = "decimal-int-comparison"
summary = "decimal compares and hashes equal with int here; the reference refuses"
reason = """
`amount > 0` rather than `amount > decimal(\"0\")`.  The present rule is \
described as the host dialect's rule for two unrelated types, but `decimal` \
is our own type in both engines, so the rule is ours to write.  Three things \
move together: ordered comparison against `int`, `decimal(\"1\") == 1`, and \
equal hashes.  Nothing about `float` moves: arithmetic and ordered comparison \
against one stay errors, because that mixing is genuinely lossy, and `==` \
against one stays false -- false rather than an error, which is what it \
already was in both engines.\
"""
ticket = "M1: dialect amendments, expressions.md"
since = "2026-09-06"
affects = ["probe/expressions/decimal-int*"]

[[divergence]]
id = "declared-blob-names-survive"
summary = "a declared data name outlives an embedded image of the same bytes here; in the reference whichever came first wins"
reason = """
doc/printout.md stores a blob once and says a template's `data` nodes "keep their declared names".  \
The reference honours the first only: a declared node and an `embed=#true` image \
with identical bytes share one entry, and the entry takes the name of whichever \
the document mentions first.  So moving an unrelated image above the node renames \
a blob the template named itself.  This engine gives a declared name precedence \
over a generated one regardless of order, which is what makes the name a property \
of the template rather than of element order.  Unlike the four above, this is \
a defect rather than a decision: the reference contradicts its own specification here, \
so nothing in doc/ changed for it."""
ticket = "M1: filed against the Go engine; printout.md#data already states the rule"
since = "2026-09-12"
affects = ["probe/data/declared-names"]

[[divergence]]
id = "hex-float-dimensions"
summary = "the reference reads a Go hexadecimal float literal as a dimension; here it is not a number"
reason = """
Neither engine said what a number is, so each took whatever its host's float \
parser accepted, and the two differ at the edges: Go's reads `0x1p-2` as 0.25, \
Python's refuses it and reads `inf`, `nan` and non-ASCII digit scripts, which \
Go's refuses.  A template one engine can read and the other cannot is worse \
than either rule alone, so doc/template.md#dimension now spells the grammar \
out -- decimal digits, an optional point, an optional exponent, underscores \
between digits -- and a hexadecimal float is outside it.  The reference is \
the side that changes; no template in the corpus writes one.\
"""
ticket = "M2: dimension grammar, template.md#dimension"
since = "2026-09-12"
affects = ["probe/values/hex-float"]

[[divergence]]
id = "non-finite-dimensions"
summary = "the reference takes #inf, #nan and an overflowing number as dimensions; here a dimension is finite"
reason = """
KDL v2 has `#inf`, `#-inf` and `#nan` as number keywords, and the rounding \
multiplies by a thousand, so `1e308` overflows on the way to points.  The \
reference checks none of the three.  Where the value reaches a mark it fails \
at serialization -- `json: unsupported value: +Inf`, after the document is \
built -- and where it does not, it builds a printout: an infinite `maxwidth` \
clamps nothing and the mark comes out intact.  doc/template.md#dimension \
already said a dimension is finite, so this is a defect rather than a \
decision; what M2 added was judging it on the points the dimension resolves \
to, which is the only place all three routes meet.\
"""
ticket = "M2: filed against the Go engine; template.md#dimension already states the rule"
since = "2026-09-12"
affects = ["probe/values/non-finite"]

[[divergence]]
id = "time-before-year-one"
summary = "a time before year 1 is refused here and built by the reference"
reason = """
`time.time()` names no field, every field defaults to zero, and Go's \
`time.Date` carries the zeros back to 30 November of the year -1.  This \
engine holds a time as an instant and reads its fields through a type that \
starts at year 1, so it refuses the construction instead.  What differs is \
only what no report can use: a date before year 1 has no field access and no \
layout that renders it.  Every call naming a year, a month and a day agrees \
exactly, carrying included -- `time.time(year=2005)` is 30 November 2004 in \
both engines.\
"""
ticket = "M3: accepted, and not worth a calendar of its own to close"
since = "2026-09-12"
affects = ["probe/expressions/time-fields*"]

[[divergence]]
id = "abs-takes-a-decimal"
summary = "abs() takes a decimal here; the reference wants an int or a float"
reason = """
`decimal` is the engine's own type in both implementations, and `min`, `max`, \
`sorted`, `float`, `int` and `str` all take one in the reference; `abs` alone \
answers "got decimal, want int or float" and refuses the template.  \
doc/expressions.md now lists `abs(d)` among the decimal helpers, so the \
reference is the side that changes.  Nothing about `math` moves: its \
functions answer with floats and go on refusing a decimal in both engines.\
"""
ticket = "M3: decimal helpers, expressions.md#the-decimal-type"
since = "2026-09-12"
affects = ["probe/expressions/decimal-abs*"]

[[divergence]]
id = "decimal-exponent-is-exact"
summary = "%e and %g keep a decimal's own digits here; the reference sends them through a float first"
reason = """
doc/expressions.md says the float conversions "accept `decimal` values and \
format them exactly", and `%f` does so in both engines -- thirty-two digits \
in and thirty-two out.  `%e` and `%g` go through binary64 in the reference, \
which shows only when the precision asks for more digits than a float holds: \
at the default of six the two agree, and `%.30e` of a thirty-two digit value \
gives the decimal's digits here and the float's there.  Exactness is what \
doc/ already says, so the reference is the side that changes.\
"""
ticket = "M3: exact decimal formatting, expressions.md#formatting"
since = "2026-09-13"
affects = ["probe/expressions/decimal-precision*"]

[[divergence]]
id = "null-folds-are-skipped"
summary = "an accumulator that combines values skips a null here; the reference refuses the build"
reason = """
Neither engine said what folding a `None` means, and both took the same \
answer from the same implementation: seed the accumulator with whatever \
comes first, then add.  That makes the answer depend on the order of the \
data, and -- worse -- it builds a report over one null row and refuses the \
same data one record longer, which is not a rule anyone would write down.  \
doc/expressions.md#calc now states one: a `None` folds into nothing.  The \
accumulators that combine values skip it and it counts toward neither \
`avg`'s divisor nor the sample size of `std` and `var`; the ones that \
collect values keep it.  That is SQL's rule for its aggregates, and it is \
the only one under which a nullable member is usable in a variable without \
a guard.  The reference is the side that changes.\
"""
ticket = "M3: null folds, expressions.md#calc"
since = "2026-09-13"
affects = ["probe/expressions/null-folds*"]

[[divergence]]
id = "unknown-names-accepted"
summary = "a node or property the format does not define is accepted here; the reference refuses it"
reason = """
Neither doc/ nor either engine's messages ever stated the rule: the \
validation list covered nesting, cardinality, required properties and \
value ranges, and none of those implies refusing an extra.  Both engines \
refused anyway.  doc/template.md#unknown-names now states the opposite, \
and states the cost of each direction rather than leaving it to taste.  \
An unknown name is accepted and warned about, so a template written for a \
newer, an older or a different implementation still builds; a name one \
edit from a name legal on that node is an error, because `printwhn=` is a \
misspelling far more often than an extension and accepting it silently \
paints an element the template meant to suppress; and `x-` names, names \
listed in a template's `accept`, and names given to `--accept` are \
accepted in silence, which is how an extension says it is one.  \
`--strict-names` restores the old behaviour for anyone who wants it.  \
The reference is the side that changes, and the `accept` node is the part \
of it that it does not have yet.\
"""
ticket = "M4: unknown names, template.md#unknown-names"
since = "2026-09-13"
affects = ["probe/values/unknown-names*"]

[[divergence]]
id = "glyph-warning-order"
summary = "glyph warnings come out in the order the build raised them; the reference sorts some of them by codepoint"
reason = """
The reference has two orders and uses them both.  A `field` without \
`stretch` reports the characters of one element sorted by codepoint and \
the elements in document order; a band whose fields all `stretch` \
reports every character of the band sorted by codepoint, document order \
gone.  Neither is a rule anyone would write down, and the two cannot \
both be one, so the oracle does not settle this question and something \
has to.  doc/printout.md#header-line now states the order: a warning \
appears where the build raised it, and a `glyph` warning is raised at \
the first element set in that font that needed the character.  It is \
the only order the four kinds have in common -- an `overflow` and an \
`unknown` have no codepoint to sort by -- and it is what both engines \
already do everywhere except that one path.  The reference is the side \
that changes.  Only a probe with two missing characters in one band \
sees it, which is why the two `breaking` probes are here and the rest \
of the corpus is not.\
"""
ticket = "M6: warning order, printout.md#header-line; filed against the Go engine"
since = "2026-09-20"
affects = ["probe/breaking/codepoints", "probe/breaking/opportunities"]

[[divergence]]
id = "zero-height-float-gap"
summary = "a floating element of no height keeps its gap here; the reference drops it"
reason = """
doc/layout.md#floating-elements places a floating element at the lowest \
bottom edge among its predecessors plus its declared gap to the nearest \
one, and nothing in that depends on the element's own height.  The \
reference follows it everywhere but one place: when the element's \
measured height is zero and something precedes it, the gap is dropped \
and the element sits exactly on the edge above it.  A field declared \
`height=0` whose text makes it taller keeps its gap there too, so it is \
the measured height that decides, and a zero-height float with nothing \
above it keeps its declared top.  That is the pattern of an element \
counted as its own nearest predecessor: only a box of no height is \
wholly above itself.  No reading of the text gives the reference's \
answer, and a rule 2pt under a paragraph that grows should stay 2pt \
under it, so this engine keeps the gap and the reference is the side \
that changes.\
"""
ticket = "M7: floating elements, layout.md#floating-elements; filed against the Go engine"
since = "2026-09-26"
affects = ["probe/layout/float-zero-height"]

[[divergence]]
id = "empty-font-table-is-null"
summary = "an empty font table is [] here; the reference writes null"
reason = """
doc/printout.md#fonts lists the fonts a document used, and a document in \
which no element prints uses none.  The table is an array whatever its \
length, and `data` beside it is written `{}` when it is empty, so this \
engine writes `"fonts":[]`.  The reference writes `"fonts":null`, which \
is not an array at all, and is the shape an absent list takes when it is \
serialized without being made empty first.  A reader that iterates the \
table fails on it.  The reference is the side that changes.\
"""
ticket = "M7: the font table, printout.md#fonts; filed against the Go engine"
since = "2026-09-26"
affects = ["probe/printout/no-fonts"]

[[divergence]]
id = "negative-sizes-refused"
summary = "a negative width, height, maxwidth, or maxheight is a validation error here; the reference accepts it"
reason = """
Neither doc/ nor either engine said what a size below zero means.  The \
reference accepts one and draws the box with no extent, while keeping \
the declared bottom above the top, so a floating element below it \
measures its gap from a point above the box and lands lower than it \
would below a height of 0.  Nothing needs that: every other effect of a \
negative size is written more plainly with a size of 0 or a negative \
`right` or `bottom`, which is what reaching past the container is for.  \
doc/template.md#position-and-size-any-two-of-three now makes a negative \
size an error, on an element, an `xref`, and a section alike, as the \
reference already does for a negative stroke width.  The reference is \
the side that changes.\
"""
ticket = "M7: negative sizes, template.md#position-and-size-any-two-of-three"
since = "2026-09-27"
affects = ["probe/values/negative-size"]

[[divergence]]
id = "font-warning-node"
summary = "a font warning names its font node here; the reference leaves node out"
reason = """
doc/printout.md#header-line gives every warning `kind`, `node`, `record`, \
and `message`, and a `font` warning, which says a typeface fell back to the \
substitute face, has a node to name: the `font` node that asked for it.  \
This engine writes it as `report > font "body"`.  The reference writes \
`node` on a `glyph` warning, as the corpus shows, and leaves it out of this \
kind, so a reader that goes from a warning to the template cannot find \
which of several fonts fell back without matching the typeface in the \
message.  The difference dates from M5; it went unregistered until \
the harness could build a probe without `--strict-fonts`, which refuses a \
`typeface` outright.  The reference is the side that changes.\
"""
ticket = "M5: font warnings, printout.md#header-line; filed against the Go engine"
since = "2026-09-27"
affects = ["probe/printout/font-warning"]

[[divergence]]
id = "column-floor"
summary = "a column opened after a band across the columns begins below it here; the reference begins it at the frame's top, under the band"
reason = """
A report title under the report's columns, or a group title under the \
group's, is placed across every column, below the first column's header.  \
When the first column fills, the reference opens the second at the column \
frame's top, which is where that band is, and draws the second column's \
rows over it.  doc/layout.md said every frame below a committed band moves \
down with it, and doc/layout.md#extent-and-fill now says how: the band \
pushes every frame inside its own down to its bottom edge and leaves that \
as the floor a column opened later on the same page begins at.  The \
column's header stays at the frame's top, where every column's header \
goes, and above the band.  Everything else about the reference's column \
fill is what doc/ describes and is unchanged, including that a band placed \
across the columns goes below the deepest and that the column in progress \
stays in progress after it.  The reference is the side that changes.\
"""
ticket = "M8: frames, layout.md#extent-and-fill; filed against the Go engine"
since = "2026-09-27"
affects = [
    "probe/pagination/column-after-title",
    "probe/pagination/column-after-group-title",
]

[[divergence]]
id = "cut-in-place"
summary = "a band too tall for any frame is cut where it is here; the reference ejects first and cuts it on an empty page"
reason = """
doc/layout.md#placing-a-band gives a band taller than an empty frame, with \
no legal split point, a last branch: split at the last cut point that fits \
`available`, because making progress beats honouring a preference.  The \
reference ejects instead and cuts the band on the next page, leaving the \
rest of the frame it was tried in empty.  Nothing in the branch asks for an \
eject, and the third branch, the one that does eject, is for a band that \
fits an empty frame, which this one does not.  doc/ now says outright that \
every branch tests the frame as it stands.  The reference is the side that \
