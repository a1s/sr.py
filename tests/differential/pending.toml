# Cases this engine cannot build yet.
#
# Not a divergence: nothing here is a decision or a defect, only work
# that has not arrived.  An entry says which milestone brings it, and
# the suite fails the moment the case starts agreeing, so a milestone
# that lands takes its entries with it.
#
# `affects` matches case identifiers with shell globs, and
# the first matching entry wins, exactly as in divergences.toml.
#
# An entry here may cover a case in `example/`, which a divergence may
# not: the examples use every node in the format, so they cannot pass
# until the last of those nodes is built.  What an entry may not do is
# cover a case divergences.toml already covers.
#
# The milestone numbers:
#   M7: Band building        M11: Images
#   M8: Pagination           M12: Subreports
#   M9: Deferred evaluation  M13: Printout completeness
#   M10: Barcodes            M14: PDF renderer

[[pending]]
id = "example-sakila"
summary = "the sakila report uses most of the format"
reason = """
Two columns, a group with its own title and summary, a column header \
and footer, six barcode types, two images, both kinds of \
cross-reference, conditional outline entries and a deferred page count. \
It is the broadest single comparison the corpus has and it starts \
passing when the last of those is built, not before: the outline entries, \
and the xref that points at one.  The barcodes are built, and drawn at \
10mil, so the reference's unrounded barcode lengths will still keep the \
two apart after M13: see `barcode-lengths-unrounded` in divergences.toml, \
which an example may not be covered by.  The images are built, and are \
drawn by `fill` at the default alignment, where the two engines agree.\
"""
ticket = "M13: outline entries"
since = "2026-09-20"
affects = ["example/sakila", "example/sakila-june"]

[[pending]]
id = "example-invoices"
summary = "the invoices report differs only in its QR symbol's box, which the reference does not round"
reason = """
An inline `embedded` subreport with an `arg` and its own `records`, \
a `template=` subreport that paginates itself onto landscape pages, \
a group using `keeptogether` with `minrows` and `mintailrows`, and \
a `summary` with `swapfooter`, all built since M12 and agreeing with the \
reference mark for mark.  What keeps the two apart is the QR-H symbol \
in the title, which `grow` fills into an 18mm box at a module of \
1.1338666666666666: the reference writes its box as binary64 left it, and \
doc/ rounds it to three decimals.  That is `barcode-lengths-unrounded` in \
divergences.toml, which an example may not be covered by, so the example \
waits here for the reference's fix.\
"""
ticket = "barcode-lengths-unrounded: filed against the Go engine"
since = "2026-09-20"
affects = ["example/invoices"]
