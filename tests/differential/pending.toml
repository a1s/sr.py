# Cases this engine cannot build yet.
#
# Not a divergence: nothing here is a decision or a defect, only work
# that has not arrived.  An entry says which milestone brings it, and
# the suite fails the moment the case starts agreeing, so a milestone
# that lands takes its entries with it.
#
# `affects` matches case identifiers with shell globs, and
# the first matching entry wins, exactly as in divergences.toml.
#
# An entry here may cover a case in `example/`, which a divergence may
# not: the examples use every node in the format, so they cannot pass
# until the last of those nodes is built.  What an entry may not do is
# cover a case divergences.toml already covers.
#
# The milestone numbers:
#   M7: Band building        M11: Images
#   M8: Pagination           M12: Subreports
#   M9: Deferred evaluation  M13: Printout completeness
#   M10: Barcodes            M14: PDF renderer

